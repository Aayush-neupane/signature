<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Signature — draw your signature and download it as a transparent PNG. Free, private, everything happens in your browser." />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong mode.
      try {
        var t = localStorage.getItem("signature-theme");
        if (!t) {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Signature — Draw. Sign. Download.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
